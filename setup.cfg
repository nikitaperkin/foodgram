[flake8]
ignore =
    W503
exclude =
    tests/,
    */migrations/,
    data/
    venv/,
    env/,
    docs/,
    frontend/,
    infra/
per-file-ignores =
    */settings.py:E501

[isort]
known_third_party =
    django
    rest_framework
    django_filters
    djoser
known_first_party =
    recipes
    api
default_section = THIRDPARTY
src_paths = backend